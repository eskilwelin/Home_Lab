scrape_configs:
- job_name: cadvisor
  scrape_interval: 5s
  static_configs:
  - targets: ['cadvisor:8080']

- job_name: 'prometheus'
  scrape_interval: 5s
  static_configs:
    - targets: ['prometheus:9090']

- job_name: 'node-exporter'
  scrape_interval: 5s
  static_configs:
    - targets: ['node-exporter:9100']

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: [ 'alertmanager:9093' ]

rule_files:
  - "/etc/prometheus/alert_rules.yml"