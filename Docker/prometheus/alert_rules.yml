groups:
  - name: node_alerts
    rules:
      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          
      - alert: HighRAM
        expr: 100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High RAM on {{ $labels.instance }}"

      - alert: ContainerDown
        expr: time() - container_last_seen{name=~"radarr|sonarr|prowlarr|bazarr|qbittorrent|plex|jellyfin"} > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is down"

      - alert: MonitoringDown
        expr: time() - container_last_seen{name=~"cadvisor|node-exporter|alertmanager|grafana"} > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is down"

      - alert: HighSwapUsage
        expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes * 100 > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High swap usage on {{ $labels.instance }}"

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name=~"radarr|sonarr|prowlarr|bazarr|qbittorrent|plex|jellyfin"}[15m]) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} is restarting frequently"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100) < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }} ({{ $labels.mountpoint }})"

      - alert: DiskWillFillIn24h
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} predicted to fill within 24h"