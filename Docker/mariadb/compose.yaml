x-healthcheck: &healtheck
  start_period: 15s
  interval: 30s
  timeout: 5s
  retries: 3

services:
  fileserver:
    build:
      context: .
      secrets:
        - samba_secrets
    container_name: fileserver
    ports: 
      - "445:445"
    volumes: 
      - ./share_data:/share
    restart: unless-stopped
    networks:
      - backend

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    env_file: mariadb.env
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      <<: *healthcheck
    restart: unless-stopped
    networks:
      - backend
    
volumes:
  mariadb_data:

networks:
  frontend:
  backend:

secrets:
  samba_secrets: 
    file: samba_secrets.txt